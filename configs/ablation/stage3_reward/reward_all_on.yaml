# ==============================================================================
# file: reward_all_on.yaml
# description: Stage3 reward-shaping layer ablation — full-on control group (baseline)
# note: all three rewards (deep-sea discovery / curiosity / penalty) are enabled, serving as the Stage3 control baseline.
#
# inheritance placeholder note (Req. Sec. 8: staged baseline-value inheritance mechanism):
#   this file has locked in the best Stage1 sensing config (center_point + temperature not entering state, used only as a bias).
#   the following two items should be replaced with Stage2's best results after Stage2 finishes:
#     chunk_finder (current=adaptive_scan, the historical 5-strategy winner); note this run uses adaptive_scan while the
#     final model adopts grid_scan, the head-to-head ray-vs-grid winner (2026-10-28, true-DLL rerun),
#     deep_sea_distance_threshold (current=416)
#   Stage3's only ablation variable is the 4 reward switches; everything else must stay consistent with the best of the previous two stages.
# ==============================================================================

# --- sensing layer (inherits the Stage1 best, locked) ---
temperature_enabled: true
temperature_in_state: false
temperature_guidance_enabled: true
temperature_guidance_weight: 3.0
temperature_guidance_min_samples: 20
temperature_bins: 10
temperature_precision: 2
spatial_granularity: 32
micro_strategy: "center_point"

# --- movement layer (historical 5-strategy optimum = adaptive_scan, 2026-09-22; the final model uses grid_scan) ---
chunk_finder: "adaptive_scan"
deep_sea_distance_threshold: 416

# --- reward switches (this file's ablation variable: full-on control group) ---
deep_sea_reward_enabled: true
curiosity_reward_enabled: true
penalty_reward_enabled: true
deep_sea_reward_value: 10.0
curiosity_reward_value: 3.0
curiosity_weight: 1.0
out_of_bounds_penalty: -10.0
repeat_visit_penalty: -5.0

# --- RL hyperparameters (explicitly locked) ---
learning_rate: 0.1
discount_factor: 0.95
epsilon_start: 1.0
epsilon_end: 0.05
epsilon_decay: 0.995
replay_buffer_size: 8192

# --- stage-switching thresholds (explicitly locked) ---
stage2_min_deep_sea_points: 5
stage3_min_deep_sea_points: 10

# --- global limits ---
max_queries_per_episode: 10000
target_deep_sea_points: 40
search_radius: 10000
