# ==============================================================================
# file: reward_no_curiosity.yaml
# description: Stage3 reward-shaping layer ablation — disable "reward for unexplored areas (curiosity)"
# note: verify whether the curiosity reward (+3 x weight) is a necessary signal. Everything else is locked to the best of the previous two stages.
#
# inheritance placeholder: chunk_finder / deep_sea_distance_threshold should, after Stage2 finishes,
#   be replaced with Stage2's best results. This file's only ablation variable is curiosity_reward_enabled=false.
# ==============================================================================

# --- sensing layer (inherits the Stage1 best, locked) ---
temperature_enabled: true
temperature_in_state: false
temperature_guidance_enabled: true
temperature_guidance_weight: 3.0
temperature_guidance_min_samples: 20
temperature_bins: 10
temperature_precision: 2
spatial_granularity: 32
micro_strategy: "center_point"

# --- movement layer (inherits the Stage2 best: winner of the full 20x20 comparison = adaptive_scan, 2026-09-22) ---
chunk_finder: "adaptive_scan"
deep_sea_distance_threshold: 416

# --- reward switches (this file's ablation variable: curiosity reward disabled) ---
deep_sea_reward_enabled: true
curiosity_reward_enabled: false     # <- disabled item
penalty_reward_enabled: true
deep_sea_reward_value: 10.0
curiosity_reward_value: 3.0         # value retained but inactive because the switch is off
curiosity_weight: 1.0
out_of_bounds_penalty: -10.0
repeat_visit_penalty: -5.0

# --- RL hyperparameters (explicitly locked) ---
learning_rate: 0.1
discount_factor: 0.95
epsilon_start: 1.0
epsilon_end: 0.05
epsilon_decay: 0.995
replay_buffer_size: 8192

# --- stage-switching thresholds (explicitly locked) ---
stage2_min_deep_sea_points: 5
stage3_min_deep_sea_points: 10

# --- global limits ---
max_queries_per_episode: 10000
target_deep_sea_points: 40
search_radius: 10000
