# ==============================================================================
# file: curiosity_weight_sweep.yaml
# description: Stage4 hyperparameter fine-tuning layer — curiosity weight sweep [1, 3, 5]
# note: the best structure of the first three stages is locked; only the curiosity reward weight (curiosity_weight) is swept.
#
# inheritance placeholder note (Req. Sec. 8): this file has locked in the best Stage1 sensing config, and the movement layer has been replaced with
#    the historical 5-strategy winner (chunk_finder=adaptive_scan / threshold=416); the final model adopts grid_scan,
#    the head-to-head ray-vs-grid winner (2026-10-28, true-DLL rerun).
#    the only ablation variable in this Stage4 file is curiosity_weight.
#
#    contains the curiosity_weight_list, iterated over by run_ablation_stage4.py.
# ==============================================================================

# --- core ablation variable: curiosity weight sweep list ---
curiosity_weight_list:
  - 1
  - 3
  - 5

# --- sensing layer (inherits the Stage1 best, locked) ---
temperature_enabled: true
temperature_in_state: false
temperature_guidance_enabled: true
temperature_guidance_weight: 3.0
temperature_guidance_min_samples: 20
temperature_bins: 10
temperature_precision: 2
spatial_granularity: 32
micro_strategy: "center_point"

# --- movement layer (historical 5-strategy optimum = adaptive_scan, 2026-09-22; the final model uses grid_scan) ---
chunk_finder: "adaptive_scan"
deep_sea_distance_threshold: 416

# --- reward switches (inherits the Stage3 best, replaced after Stage3 finishes) ---
deep_sea_reward_enabled: true
curiosity_reward_enabled: true
penalty_reward_enabled: true
deep_sea_reward_value: 10.0
curiosity_reward_value: 3.0
# curiosity_weight is injected item by item at runtime from curiosity_weight_list
out_of_bounds_penalty: -10.0
repeat_visit_penalty: -5.0

# --- RL hyperparameters (explicitly locked) ---
learning_rate: 0.1
discount_factor: 0.95
epsilon_start: 1.0
epsilon_end: 0.05
epsilon_decay: 0.995
replay_buffer_size: 8192

# --- stage-switching thresholds (explicitly locked) ---
stage2_min_deep_sea_points: 5
stage3_min_deep_sea_points: 10

# --- global limits ---
max_queries_per_episode: 10000
target_deep_sea_points: 40
search_radius: 10000
