# ==============================================================================
# File: query_target_sweep.yaml
# Description: Stage4 hyperparameter fine-tuning layer —— query budget / target count sweep
# Notes: Lock the optimal structure from the first three stages, sweep different query budgets to plot convergence curves,
#       demonstrating sample efficiency superior to baseline algorithms under this budget (Req. Sec. 13 academic justification).
#
# Req. Sec. 10 specific requirement: When this configuration runs, it [must] output standard
#   "queries - cumulative discovered points" CSV data for plotting convergence curves.
#   Extracted by run_ablation_stage4.py from the convergence_data returned by run_experiment,
#   and exported as stage4_convergence.csv and stage4_convergence_curves.png.
#
# ⚠️ Inherited placeholders (Req. Sec. 8): chunk_finder / deep_sea_distance_threshold / reward switches
#   should be replaced with their optimal results after the first three stages are completed. The only ablation variables in this file are query budget and target points.
#
# ⚠️ Contains query_budget_list (budget) and target_list (target points); the two are paired by index during the sweep.
# ==============================================================================

# --- Core ablation variables: query budget sweep list ---
# Academic justification (Req. Sec. 13): 6500 represents a medium computational budget; values around it are extended here to plot convergence curves,
# observing the inflection point of sample efficiency growth with budget to determine the most cost-effective budget tier.
query_budget_list:
  - 2000
  - 4000
  - 6500
  - 10000

# --- Paired target deep-sea points (same length as query_budget_list, paired by index) ---
# Req. Sec. 13: 40 target points force the algorithm to demonstrate long-distance macro-transition capability, avoiding local optima.
# All budget tiers uniformly use 40 targets so that convergence curves are comparable under the same target.
target_list:
  - 40
  - 40
  - 40
  - 40

# --- Perception layer (inherited from Stage1 optimum, locked) ---
temperature_enabled: true
temperature_in_state: false
temperature_guidance_enabled: true
temperature_guidance_weight: 3.0
temperature_guidance_min_samples: 20
temperature_bins: 10
temperature_precision: 2
spatial_granularity: 32
micro_strategy: "center_point"

# --- Movement layer (historical 5-strategy optimum = adaptive_scan, 2026-09-22; final model uses grid_scan, the ray-vs-grid winner) ---
chunk_finder: "adaptive_scan"
deep_sea_distance_threshold: 416

# --- Reward switches (inherited from Stage3 optimum, replace after Stage3 is completed) ---
deep_sea_reward_enabled: true
curiosity_reward_enabled: true
penalty_reward_enabled: true
deep_sea_reward_value: 10.0
curiosity_reward_value: 3.0
curiosity_weight: 1.0
out_of_bounds_penalty: -10.0
repeat_visit_penalty: -5.0

# --- RL hyperparameters (explicitly locked) ---
learning_rate: 0.1
discount_factor: 0.95
epsilon_start: 1.0
epsilon_end: 0.05
epsilon_decay: 0.995
replay_buffer_size: 8192

# --- Stage transition thresholds (explicitly locked) ---
stage2_min_deep_sea_points: 5
stage3_min_deep_sea_points: 10

# --- Global limits (max_queries/target injected item by item at runtime from the two lists above) ---
search_radius: 10000
