# ==============================================================================
# File: finder_sweep.yaml
# Description: Stage2 macro-movement layer ablation —— macro-traversal strategy sweep
# Notes: Lock Stage1 optimal perception config; only test [macro-traversal strategy].
#
# Inherits Stage1 optimum (Req. Sec. 8: stage-wise baseline inheritance mechanism):
#   · Micro point selection = center_point (Stage1 empirical optimum 32.84, with minimum query overhead)
#   · Temperature architecture = master switch ON + not in Q state + guidance bias ON (empirical: in-state is harmful, bias is beneficial)
#
# ⚠️ Contains chunk_finder_list; cannot be passed directly to DeepSeaExplorer,
#    run_ablation_stage2.py iterates over the list to dynamically generate single-strategy configs for execution.
# ==============================================================================

# --- Core ablation variable: list of macro-traversal strategies to sweep ---
# ray_scan/spiral_scan/adaptive_scan = the 3 original methods from Req. Sec. 9
# grid_scan  = spaced grid scan (grid spacing = threshold, eliminates repulsion waste; empirical bottleneck solution)
# anchor_scan= anchor repositioning scan (after finding a deep-sea point, expand outward from that point; implements Req. Sec. 1 Item 4)
chunk_finder_list:
  - "ray_scan"
  - "spiral_scan"
  - "adaptive_scan"
  - "grid_scan"
  - "anchor_scan"

# --- Perception layer (inherited from Stage1 optimum, all locked) ---
temperature_enabled: true
temperature_in_state: false     # Temperature not in Q state (empirical: entering state dilutes learning)
temperature_guidance_enabled: true   # Temperature only used as Stage3 macro guidance bias (empirical +0.79)
temperature_guidance_weight: 3.0
temperature_guidance_min_samples: 20
temperature_bins: 10
temperature_precision: 2
spatial_granularity: 32
micro_strategy: "center_point"  # Stage1 optimal micro strategy

# --- Movement layer (locked items in this file except chunk_finder) ---
deep_sea_distance_threshold: 416

# --- Reward config (inherited baseline, all enabled) ---
deep_sea_reward_enabled: true
curiosity_reward_enabled: true
penalty_reward_enabled: true
deep_sea_reward_value: 10.0
curiosity_reward_value: 3.0
curiosity_weight: 1.0
out_of_bounds_penalty: -10.0
repeat_visit_penalty: -5.0

# --- RL hyperparameters (explicitly locked to prevent default drift) ---
learning_rate: 0.1
discount_factor: 0.95
epsilon_start: 1.0
epsilon_end: 0.05
epsilon_decay: 0.995
replay_buffer_size: 8192

# --- Stage transition thresholds (explicitly locked) ---
stage2_min_deep_sea_points: 5
stage3_min_deep_sea_points: 10

# --- Global limits ---
max_queries_per_episode: 10000
target_deep_sea_points: 40
search_radius: 10000
