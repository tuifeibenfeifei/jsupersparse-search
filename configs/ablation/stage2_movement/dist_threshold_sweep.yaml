# ==============================================================================
# File: dist_threshold_sweep.yaml
# Description: Stage2 macro-movement layer ablation —— deep-sea point distance threshold sweep [416, 448, 480, 512]
# Notes: Lock Stage1 optimal perception config + single macro strategy; only test [deep-sea point distance threshold].
#
# Academic justification (Req. Sec. 13): 416~512 is based on the MC1.17 Ocean Monument 32×32 chunk (512 cells) Region
#   spawn grid; 416 is the theoretical minimum Euclidean distance between monuments in two adjacent Regions, used to filter redundant probes within the same spawn grid.
#
# ⚠️ Single-finder constraint: this file locks chunk_finder=ray_scan (Stage1 baseline traversal),
#    because the diffusion spacing of grid_scan/anchor_scan is derived from deep_sea_distance_threshold,
#    simultaneously sweeping both finder and threshold would couple two variables, violating the controlled-variable principle (Req. Sec. 8).
#    The threshold sweep must be rerun with the optimal traversal strategy locked after finder_sweep determines it (see script comments).
#
# ⚠️ Contains distance_threshold_list; iterated by run_ablation_stage2.py.
# ==============================================================================

# --- Core ablation variable: list of distance thresholds to sweep (cells) ---
distance_threshold_list:
  - 416
  - 448
  - 480
  - 512

# --- Perception layer (inherited from Stage1 optimum, all locked) ---
temperature_enabled: true
temperature_in_state: false
temperature_guidance_enabled: true
temperature_guidance_weight: 3.0
temperature_guidance_min_samples: 20
temperature_bins: 10
temperature_precision: 2
spatial_granularity: 32
micro_strategy: "center_point"

# --- Movement layer (single traversal strategy locked in this file) ---
chunk_finder: "ray_scan"
# deep_sea_distance_threshold is injected item by item at runtime from distance_threshold_list

# --- Reward config (inherited baseline, all enabled) ---
deep_sea_reward_enabled: true
curiosity_reward_enabled: true
penalty_reward_enabled: true
deep_sea_reward_value: 10.0
curiosity_reward_value: 3.0
curiosity_weight: 1.0
out_of_bounds_penalty: -10.0
repeat_visit_penalty: -5.0

# --- RL hyperparameters (explicitly locked) ---
learning_rate: 0.1
discount_factor: 0.95
epsilon_start: 1.0
epsilon_end: 0.05
epsilon_decay: 0.995
replay_buffer_size: 8192

# --- Stage transition thresholds (explicitly locked) ---
stage2_min_deep_sea_points: 5
stage3_min_deep_sea_points: 10

# --- Global limits ---
max_queries_per_episode: 10000
target_deep_sea_points: 40
search_radius: 10000
