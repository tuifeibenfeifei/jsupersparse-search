# ==============================================================================
# 文件: icm.yaml
# 描述: ICM（Intrinsic Curiosity Module）基线算法参数配置
# 说明: 基线算法独立于主框架（只依赖 L0 + 自带 numpy 网络），本文件为其
#       唯一数值来源。RL 超参与主框架对齐，ICM 专属参数单独列出。
# ==============================================================================

# --- 与主框架对齐的全局限制 ---
search_radius: 10000
max_queries_per_episode: 10000
target_deep_sea_points: 40
deep_sea_distance_threshold: 416
temperature_enabled: true

# --- RL 超参（与主框架 Stage1 基准值对齐，便于横向对比） ---
learning_rate: 0.1
discount_factor: 0.95
epsilon_start: 1.0
epsilon_end: 0.05
epsilon_decay: 0.995
action_directions: 8
action_steps: [1, 2, 4, 8]

# --- 外在奖励数值（与主框架奖励模块默认值对齐） ---
deep_sea_reward_value: 10.0
out_of_bounds_penalty: -10.0
repeat_visit_penalty: -5.0

# --- ICM 专属参数 ---
# intrinsic_weight: 内在奖励（前向预测误差）的总权重
intrinsic_weight: 1.0
# icm_hidden_size: 前向模型隐藏层宽度
icm_hidden_size: 32
# icm_learning_rate: 前向模型 SGD 学习率
icm_learning_rate: 0.01
