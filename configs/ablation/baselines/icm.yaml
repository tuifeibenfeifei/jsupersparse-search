# ==============================================================================
# file: icm.yaml
# description: ICM (Intrinsic Curiosity Module) baseline algorithm parameter config
# note: the baseline algorithm is independent of the main framework (depends only on L0 + its own numpy network); this file is its
#       sole numerical source. RL hyperparameters are aligned with the main framework; ICM-specific parameters are listed separately.
# ==============================================================================

# --- global limits aligned with the main framework ---
search_radius: 10000
max_queries_per_episode: 10000
target_deep_sea_points: 40
deep_sea_distance_threshold: 416
temperature_enabled: true

# --- RL hyperparameters (aligned with the main framework Stage1 baseline for horizontal comparison) ---
learning_rate: 0.1
discount_factor: 0.95
epsilon_start: 1.0
epsilon_end: 0.05
epsilon_decay: 0.995
action_directions: 8
action_steps: [1, 2, 4, 8]

# --- extrinsic reward values (aligned with the main framework reward-module defaults) ---
deep_sea_reward_value: 10.0
out_of_bounds_penalty: -10.0
repeat_visit_penalty: -5.0

# --- ICM-specific parameters ---
# intrinsic_weight: total weight of the intrinsic reward (forward prediction error)
intrinsic_weight: 1.0
# icm_hidden_size: forward-model hidden-layer width
icm_hidden_size: 32
# icm_learning_rate: forward-model SGD learning rate
icm_learning_rate: 0.01
