# ==============================================================================
# 文件: bfs.yaml
# 描述: BFS 广度优先搜索基线参数配置
# 说明: 基线算法独立于主框架（只依赖 L0），本文件为其唯一数值来源。
#       与主框架共享的全局限制（预算/目标/半径/间距阈值）与主框架对齐，
#       便于横向对比。
# ==============================================================================

# --- 与主框架对齐的全局限制 ---
search_radius: 10000
max_queries_per_episode: 10000
target_deep_sea_points: 40
deep_sea_distance_threshold: 416
temperature_enabled: true

# --- BFS 专属参数 ---
# bfs_expand_step: BFS 邻域扩展步长（区块）。1 = 逐区块广度扫描
bfs_expand_step: 1
