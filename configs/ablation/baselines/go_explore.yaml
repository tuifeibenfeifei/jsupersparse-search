# ==============================================================================
# 文件: go_explore.yaml
# 描述: Go-Explore 基线算法参数配置
# 说明: 基线算法独立于主框架（只依赖 L0），本文件为其唯一数值来源。
#       与主框架共享的全局限制（预算/目标/半径/间距阈值）与主框架对齐。
# ==============================================================================

# --- 与主框架对齐的全局限制 ---
search_radius: 10000
max_queries_per_episode: 10000
target_deep_sea_points: 40
deep_sea_distance_threshold: 416
temperature_enabled: true

# --- Go-Explore 专属参数 ---
# go_explore_return_prob: 每步回退到档案（archive）中高价值单元的概率
go_explore_return_prob: 0.15
# go_explore_expand_step: 深海点邻域扩展步长（区块）
go_explore_expand_step: 2
