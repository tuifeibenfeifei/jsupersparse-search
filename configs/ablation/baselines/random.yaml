# ==============================================================================
# file: random.yaml
# description: pure random-sampling baseline parameter config
# note: the baseline algorithm is independent of the main framework (depends only on L0); this file is its sole numerical source.
#       global limits shared with the main framework (budget / target / radius / spacing threshold) are aligned with it.
# ==============================================================================

# --- global limits aligned with the main framework ---
search_radius: 10000
max_queries_per_episode: 10000
target_deep_sea_points: 40
deep_sea_distance_threshold: 416
temperature_enabled: true

# --- Random-specific parameters ---
# no extra parameters: the algorithm randomness is driven by the algo_seed injected by the scheduling script
