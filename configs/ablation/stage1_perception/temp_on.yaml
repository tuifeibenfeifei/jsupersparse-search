# ==============================================================================
# 文件: temp_on.yaml
# 描述: Stage1 感知层消融：开启温度特征（黑盒触觉基准）
# 说明: 除 temperature_enabled 外，所有变量（含RL超参）显式锁定为 Stage1 基准值
# ==============================================================================

# --- 核心消融变量 ---
temperature_enabled: true
temperature_bins: 10          # 温度直方图分桶数；分桶范围由实测数据决定，不预设温度区间
temperature_precision: 2      # 状态编码的温度量化精度（保留小数位数），非温度范围上下界
# 状态格空间粒度（区块数）。温度层分辨率为 16 区块（256 方块），同一区块内温度恒定，
# 故本值必须 > 16，温度才携带增量信息；若 <= 16，温度可由区块坐标整除推出，
# temperature on/off 消融将得到完全相同的结果，该消融即失去意义。
spatial_granularity: 32

# --- 温度导向搜索（需求第一节第10条 + 第四节第27行）---
# agent 自主统计「温度带 → 深海概率」(Wilson下界)，在 Stage3 把高概率温度带
# 作为宏观动作选择的探索先验。温度不进奖励公式（守第6/30条），零人工温度阈值。
# 实测依据：frozen 带深海率 1.77x 基准，且关系非单调（cold 17.9% < normal 23.5%），
# 人工"越冷越好"启发式会失效，故由 agent 自主学习概率表。
temperature_guidance_enabled: true
temperature_guidance_weight: 3.0        # 探索先验权重（Stage4 可扫描）
temperature_guidance_min_samples: 20    # 概率表生效所需最小温度样本数，不足则退回纯 RL

# --- 策略配置 ---
micro_strategy: "corners_and_center"
chunk_finder: "ray_scan"

# --- 距离与奖励配置 ---
deep_sea_distance_threshold: 416
deep_sea_reward_enabled: true
curiosity_reward_enabled: true
penalty_reward_enabled: true
deep_sea_reward_value: 10.0
curiosity_reward_value: 3.0
curiosity_weight: 1.0
out_of_bounds_penalty: -10.0
repeat_visit_penalty: -5.0

# --- RL超参数（显式锁定，防止默认值漂移） ---
learning_rate: 0.1
discount_factor: 0.95
epsilon_start: 1.0
epsilon_end: 0.05
epsilon_decay: 0.995
replay_buffer_size: 8192

# --- 阶段切换阈值（显式锁定） ---
stage2_min_deep_sea_points: 5
stage3_min_deep_sea_points: 10

# --- 全局限制 ---
max_queries_per_episode: 10000
target_deep_sea_points: 40
search_radius: 10000