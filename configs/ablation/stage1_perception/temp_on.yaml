# ==============================================================================
# File: temp_on.yaml
# Description: Stage1 perception layer ablation: enable temperature feature (black-box tactile baseline)
# Notes: Except for temperature_enabled, all variables (including RL hyperparameters) are explicitly locked to Stage1 baseline values
# ==============================================================================

# --- Core ablation variables ---
temperature_enabled: true
temperature_bins: 10          # Number of temperature histogram bins; bin range determined by empirical data, no preset temperature range
temperature_precision: 2      # Temperature quantization precision for state encoding (decimal places kept), not temperature range bounds
# State grid spatial granularity (number of chunks). Temperature layer resolution is 16 chunks (256 blocks); temperature is constant within the same chunk,
# so this value must be > 16 for temperature to carry incremental information; if <= 16, temperature can be derived by integer division of chunk coordinates,
# the temperature on/off ablation will yield identical results, making this ablation meaningless.
spatial_granularity: 32

# --- Temperature-guided search (Req. Sec. 1 Item 10 + Sec. 4 Line 27) ---
# Agent autonomously computes "temperature band → deep-sea probability" (Wilson lower bound); in Stage3, high-probability temperature bands
# are used as exploration priors for macro-action selection. Temperature does not enter the reward formula (per Items 6/30); zero manual temperature thresholds.
# Empirical justification: frozen band deep-sea rate is 1.77x baseline, and the relationship is non-monotonic (cold 17.9% < normal 23.5%),
# so the manual "colder is better" heuristic would fail; the agent learns the probability table autonomously.
temperature_guidance_enabled: true
temperature_guidance_weight: 3.0        # Exploration prior weight (sweepable in Stage4)
temperature_guidance_min_samples: 20    # Minimum temperature samples required for the probability table to activate; falls back to pure RL if insufficient

# --- Strategy config ---
micro_strategy: "corners_and_center"
chunk_finder: "ray_scan"

# --- Distance and reward config ---
deep_sea_distance_threshold: 416
deep_sea_reward_enabled: true
curiosity_reward_enabled: true
penalty_reward_enabled: true
deep_sea_reward_value: 10.0
curiosity_reward_value: 3.0
curiosity_weight: 1.0
out_of_bounds_penalty: -10.0
repeat_visit_penalty: -5.0

# --- RL hyperparameters (explicitly locked to prevent default drift) ---
learning_rate: 0.1
discount_factor: 0.95
epsilon_start: 1.0
epsilon_end: 0.05
epsilon_decay: 0.995
replay_buffer_size: 8192

# --- Stage transition thresholds (explicitly locked) ---
stage2_min_deep_sea_points: 5
stage3_min_deep_sea_points: 10

# --- Global limits ---
max_queries_per_episode: 10000
target_deep_sea_points: 40
search_radius: 10000