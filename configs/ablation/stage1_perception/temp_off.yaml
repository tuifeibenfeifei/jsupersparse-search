# ==============================================================================
# File: temp_off.yaml
# Description: Stage1 perception layer ablation: disable temperature feature (pure blind sweep control group)
# Notes: Validate the necessity of temperature as a black-box tactile feature (expected success rate decrease ~20%)
#       All variables (including RL hyperparameters) are explicitly locked to Stage1 baseline values
# ==============================================================================

# --- Core ablation variables ---
temperature_enabled: false
temperature_bins: 10          # Even when temperature perception is disabled, lock bin count to keep config structure consistent
temperature_precision: 2      # Same as above; lock quantization precision; this parameter has no effect when temperature is off
# Locked to the same value as temp_on.yaml: the only variable in this group is temperature_enabled,
# state granularity must be identical across both groups, otherwise the difference cannot be attributed to the temperature switch (controlled-variable principle).
spatial_granularity: 32

# --- Temperature-guided search (control group) ---
# When temperature perception is off, the temperature probability table used by the bias has no data and the feature automatically disables; explicitly set off here to maintain structural consistency.
temperature_guidance_enabled: false
temperature_guidance_weight: 3.0        # Locked to the same value as temp_on; has no effect when off
temperature_guidance_min_samples: 20    # Same as above

# --- Strategy config ---
micro_strategy: "corners_and_center"
chunk_finder: "ray_scan"

# --- Distance and reward config ---
deep_sea_distance_threshold: 416
deep_sea_reward_enabled: true
curiosity_reward_enabled: true
penalty_reward_enabled: true
deep_sea_reward_value: 10.0
curiosity_reward_value: 3.0
curiosity_weight: 1.0
out_of_bounds_penalty: -10.0
repeat_visit_penalty: -5.0

# --- RL hyperparameters (explicitly locked to prevent default drift) ---
learning_rate: 0.1
discount_factor: 0.95
epsilon_start: 1.0
epsilon_end: 0.05
epsilon_decay: 0.995
replay_buffer_size: 8192

# --- Stage transition thresholds (explicitly locked) ---
stage2_min_deep_sea_points: 5
stage3_min_deep_sea_points: 10

# --- Global limits ---
max_queries_per_episode: 10000
target_deep_sea_points: 40
search_radius: 10000