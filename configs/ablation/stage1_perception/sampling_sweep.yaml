# ==============================================================================
# File: sampling_sweep.yaml
# Description: Stage1 perception layer ablation: sweep of 9 micro point-selection strategies
# Notes: Temperature fixed ON (black-box innovation baseline); iterate over all within-chunk sampling methods
# 
# ⚠️ Note: This file is a batch sweep configuration containing the micro_strategy_list.
#          Cannot be passed directly to DeepSeaExplorer; must be processed by an upper-level scheduling script
#          (e.g., run_ablation_sweep.py) that iterates over the list and dynamically generates single-strategy configs for execution.
# ==============================================================================

# --- Core ablation variables ---
temperature_enabled: true
temperature_bins: 10          # Number of temperature histogram bins; bin range determined by empirical data, no preset temperature range
temperature_precision: 2      # Temperature quantization precision for state encoding (decimal places kept), not temperature range bounds
# State grid spatial granularity (number of chunks), locked to the same value as temp_on.yaml.
# The only ablation variable in this file is micro_strategy (9 micro point-selection methods); all others are locked,
# to avoid confounding strategy differences with state granularity differences. Must be > 16 (temperature layer resolution) for temperature to be effective.
spatial_granularity: 32

# --- Temperature-guided search (same as temp_on; the only variable in this file is micro_strategy) ---
temperature_guidance_enabled: true
temperature_guidance_weight: 3.0
temperature_guidance_min_samples: 20

# --- Sweep list (parsed by the scheduling script) ---
micro_strategy_list:
  - "center_point"
  - "corner_points"
  - "random_two_points"
  - "grid_3x3"
  - "corners_and_center"
  - "any_three_corners"
  - "t_shape"
  - "adaptive_sampling"
  - "diagonal_two_points"

# --- Strategy config ---
chunk_finder: "ray_scan"

# --- Distance and reward config ---
deep_sea_distance_threshold: 416
deep_sea_reward_enabled: true
curiosity_reward_enabled: true
penalty_reward_enabled: true
deep_sea_reward_value: 10.0
curiosity_reward_value: 3.0
curiosity_weight: 1.0
out_of_bounds_penalty: -10.0
repeat_visit_penalty: -5.0

# --- RL hyperparameters (explicitly locked to prevent default drift) ---
learning_rate: 0.1
discount_factor: 0.95
epsilon_start: 1.0
epsilon_end: 0.05
epsilon_decay: 0.995
replay_buffer_size: 8192

# --- Stage transition thresholds (explicitly locked) ---
stage2_min_deep_sea_points: 5
stage3_min_deep_sea_points: 10

# --- Global limits ---
max_queries_per_episode: 10000
target_deep_sea_points: 40
search_radius: 10000