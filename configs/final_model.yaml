# ==============================================================================
# File: final_model.yaml
# Description: Final model config (L5 final validation layer / Req. Sec. 8 Stage5)
# Notes: Composed of optimal results from each stage:
#   · Stage1 optimal perception: micro_strategy=center_point + temperature not in Q state, used only as guidance bias
#   · Stage2 comparison winner: chunk_finder=grid_scan (focused ray_scan vs grid_scan head-to-head,
#     20 world seeds x 20 repeats = 400 runs per strategy, both reach 40/40 points in 400/400 runs;
#     grid_scan 2926.5 mean queries vs ray_scan 3154.1, i.e. 7.2% fewer queries, so grid_scan is adopted)
#   · Stage3 baseline: all rewards enabled (deep-sea +10 / curiosity +3×1.0 weight unchanged / penalty -10, -5)
#   · Global limits: 40 deep-sea points + 10000 query cap (user-specified; no longer determined by Stage4)
# ==============================================================================

# --- Experiment metadata ---
experiment_name: "final_model"
output_mode: "simple"

# --- Temperature perception (Stage1 optimum: master switch ON + not in Q state + guidance bias ON) ---
temperature_enabled: true
temperature_in_state: false
temperature_bins: 10
temperature_precision: 2
spatial_granularity: 32
temperature_guidance_enabled: true
temperature_guidance_weight: 3.0
temperature_guidance_min_samples: 20

# --- Perception layer (micro point selection) ---
micro_strategy: "center_point"

# --- Movement layer (macro traversal; Stage2 ray vs grid head-to-head winner: grid_scan) ---
chunk_finder: "grid_scan"
deep_sea_distance_threshold: 416

# --- Reward layer (Stage3 baseline: all enabled; curiosity values unchanged) ---
deep_sea_reward_enabled: true
deep_sea_reward_value: 10.0
curiosity_reward_enabled: true
curiosity_reward_value: 3.0
curiosity_weight: 1.0
penalty_reward_enabled: true
out_of_bounds_penalty: -10.0
repeat_visit_penalty: -5.0

# --- RL hyperparameters (consistent with stage baseline values) ---
learning_rate: 0.1
discount_factor: 0.95
epsilon_start: 1.0
epsilon_end: 0.05
epsilon_decay: 0.995
replay_buffer_size: 8192
replay_batch_size: 16
replay_frequency: 5

# --- Stage thresholds (multi-stage learning mechanism) ---
stage2_min_deep_sea_points: 5
stage3_min_deep_sea_points: 10

# --- Global target limits (user-specified: 40 points + 10000 query cap) ---
max_queries_per_episode: 10000
target_deep_sea_points: 40
search_radius: 10000

# --- Action space ---
action_directions: 8
action_steps: [1, 2, 4, 8]
# Req. Sec. 1: remember (direction, step) pairs that produced deep-sea finds and weight them higher
# later. Kept at the algorithm default 0.5 so the final model is identical to the config that every
# ablation stage validated (the previous 0.0 silently disabled the mechanism and inflated queries).
direction_memory_bonus: 0.5
